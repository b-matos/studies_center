project:
  type: website
  output-dir: _site

format:
  html:
    theme: [default, assets/styles.scss]
    toc: true
    toc-title: ""
    toc-depth: 2
    title-block-banner: "#f0fdfa"
    title-block-banner-color: "#134e4a"
    smooth-scroll: true
    include-in-header:
      text: |
        <script src="/assets/lang-switch.js"></script>

website:
  page-footer:
    center: "Dados abertos · cada afirmação tem fonte, excerto e data de acesso · dados: INE, Eurostat (CC BY 4.0 / reutilização com atribuição)"

execute:
  echo: false
  freeze: auto
