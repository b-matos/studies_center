name: Publish site

# Builds the read-only public site (published studies + events, no queue, no costs)
# and deploys it to GitHub Pages. In the repo settings: Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "studies/**"
      - "events/**"
      - "site/**"
      - "common/**"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - run: uv sync --frozen --no-dev
      - run: uv run python site/build.py --public
        env:
          PYTHONPATH: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site_public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
