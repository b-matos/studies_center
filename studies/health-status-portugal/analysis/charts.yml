  title_pt: 'Mortalidade padronizada por causa e região NUTS II (Eurostat, 2011-2023;
    Centro: PT16 até 2021, PT19 em 2023)'
  why: 'Região por causa de morte: o contraste de níveis lê-se melhor em cor.'
q03_causes_regions_2024:
  axis: mortalidade
  data_file: q03_causes_regions_2024.json
  kind: table
  title_en: Standardised mortality by cause and NUTS 2024 region (INE, 2024)
  title_pt: Mortalidade padronizada por causa e região NUTS 2024 (INE, 2024)
  why: Poucas regiões NUTS 2024 e causas; os valores exatos importam mais que a forma.
