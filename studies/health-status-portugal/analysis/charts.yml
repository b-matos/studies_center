q01_life_expectancy:
  axis: esperanca-de-vida
  data_file: q01_life_expectancy.json
  kind: small_multiples
  title_en: Life expectancy at birth and at 65, Portugal and EU-27 (1960-2024)
  title_pt: Esperança de vida à nascença e aos 65 anos, Portugal e UE-27 (1960-2024)
  why: 'Várias séries com escalas e unidades diferentes: um painel por série evita
    sobrepor linhas.'
q01_life_expectancy_regions:
  axis: esperanca-de-vida
  data_file: q01_life_expectancy_regions.json
  kind: small_multiples
  title_en: Life expectancy at birth by NUTS II region (three-year periods, INE)
  title_pt: Esperança de vida à nascença por região NUTS II (triénios, INE)
  why: 'Várias séries com escalas e unidades diferentes: um painel por série evita
    sobrepor linhas.'
q02_healthy_life_years:
  axis: esperanca-de-vida
  data_file: q02_healthy_life_years.json
  kind: ranking
  title_en: Healthy life years and share of life expectancy, Portugal and EU-27 (2004-2024)
  title_pt: Anos de vida saudável e peso na esperança de vida, Portugal e UE-27 (2004-2024)
  why: Compara Portugal com os Estados-Membros num indicador e ano, ordenados.
q03_causes_pt_eu:
  axis: mortalidade
  data_file: q03_causes_pt_eu.json
  kind: ranking
  title_en: Age-standardised death rate by cause, Portugal and EU-27 (2011-2023)
  title_pt: Taxa de mortalidade padronizada por causa, Portugal e UE-27 (2011-2023)
  why: Compara taxas padronizadas por causa entre Portugal e a UE-27, ordenadas.
q03_causes_regions:
  axis: mortalidade
  data_file: q03_causes_regions.json
  kind: heatmap
  title_en: 'Standardised death rate by cause and NUTS II region (Eurostat, 2011-2023;
